apiVersion: aisolate.dev/v1
kind: Airlock
metadata: {name: acme-hr}
spec:
  space: hr-acme
  displayName: Acme HR assistant
  # Only its space's roles: employee and ceo.
  access: {roles: [], callers: ["*"]}
  dataSources:
    - id: hr-documents
      url: jdbc:postgresql://acme-db.aisolate.svc:5432/acme_hr
      secretRef: hr-acme-acme-hr-ds-hr-documents-d4e5f6
---
apiVersion: aisolate.dev/v1
kind: Airlock
metadata: {name: strict-app}
spec:
  space: strict-space
  displayName: Strict app
  access: {roles: [employee, ceo], callers: [acme-chat]}
---
apiVersion: aisolate.dev/v1
kind: Airlock
metadata: {name: short-app}
spec:
  space: hr-acme
  displayName: Short app
  # Its space's roles plus intern, who may ask this airlock only.
  access: {roles: [intern], callers: ["*"]}
---
apiVersion: aisolate.dev/v1
kind: Airlock
metadata: {name: closed-app}
spec:
  space: strict-space
  displayName: Closed app
  # Neither it nor its space lists a role: nobody may ask it.
  access: {roles: [], callers: ["*"]}
