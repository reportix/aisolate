spring.application.name=aisolate-airlock
server.port=8080
spring.threads.virtual.enabled=true

# The customer's identity provider: issuer and audience; the keys come from the issuer's JWKS.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AISOLATE_ISSUER_URI:http://localhost:8180/realms/acme}
spring.security.oauth2.resourceserver.jwt.audiences=aisolate
aisolate.roles-claim=${AISOLATE_ROLES_CLAIM:realm_access.roles}
aisolate.cors.allowed-origins=${AISOLATE_CORS_ALLOWED_ORIGINS:*}
aisolate.public-url=${AISOLATE_PUBLIC_URL:http://localhost:8080}

# The release: the documents the controller mounted, their revision, the one airlock this pod serves,
# its tool server.
aisolate.config.dir=${AISOLATE_CONFIG_DIR:}
aisolate.config.revision=${AISOLATE_CONFIG_REVISION:}
aisolate.config.discovery-dir=${AISOLATE_CONFIG_DISCOVERY_DIR:}
aisolate.airlock=${AISOLATE_AIRLOCK:}
aisolate.tool-server.url=${AISOLATE_TOOL_SERVER_URL:http://localhost:8081/mcp}
aisolate.exchange.max-duration=${AISOLATE_EXCHANGE_MAX_DURATION:8m}

# The airlock's jar, fetched at start from the backend (AISOLATE_CODE_URL, with the airlock's code token) and
# checked against AISOLATE_CODE_DIGEST; any refusal fails the start. Without a digest, a local run or a test
# loads the jars of AISOLATE_PLUGINS_DIR pinned by AISOLATE_PLUGIN_DIGESTS; nothing renders those in a cluster.
aisolate.code.url=${AISOLATE_CODE_URL:}
aisolate.code.digest=${AISOLATE_CODE_DIGEST:}
aisolate.code.token-file=${AISOLATE_CODE_TOKEN_FILE:}
aisolate.plugins.dir=${AISOLATE_PLUGINS_DIR:}
aisolate.plugins.digests=${AISOLATE_PLUGIN_DIGESTS:}

# The audit trail: the backend's ingest and the airlock's token the controller mounted (empty URL: stdout
# alone), the buffer of unsent lines on the pod's emptyDir, fail closed when it is full, stdout too.
aisolate.audit.url=${AISOLATE_AUDIT_URL:}
aisolate.audit.token-file=${AISOLATE_AUDIT_TOKEN_FILE:}
aisolate.audit.buffer-dir=${AISOLATE_AUDIT_BUFFER_DIR:/var/lib/aisolate/audit}
aisolate.audit.fail-closed=${AISOLATE_AUDIT_FAIL_CLOSED:true}
aisolate.audit.stdout=${AISOLATE_AUDIT_STDOUT:true}

# aisolate.datasource[i].*, from AISOLATE_DATASOURCE_<i>_*: the data sources a handler reaches by id.

# The LLMs: AISOLATE_LLM, the main one's id, and AISOLATE_LLM_<i>_ID/_PROVIDER/_URL/_MODEL/_API_KEY, one
# Ollama or OpenAI client each (LlmCatalog); no default. Spring AI's autoconfigured models are off.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.http.client.settings.connect-timeout=5s
spring.http.client.settings.read-timeout=${AISOLATE_MODEL_READ_TIMEOUT:90s}
# No retry: Spring AI's default (10, backing off to 3 min) outlasts the exchange budget and the
# Ingress, and logs each failure's response body at WARN. A model that fails is an error event now.
spring.ai.retry.max-attempts=0

# The API docs are the developer's, off in the pod (the controller sets AISOLATE_API_DOCS=false).
springdoc.api-docs.enabled=${AISOLATE_API_DOCS:true}

# Every exchange is a trace. No prompt, completion or tool content goes into a span: Spring AI's
# defaults, written down so nobody turns them on by accident.
management.tracing.sampling.probability=1.0
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.client.observations.log-completion=false
spring.ai.tools.observations.include-content=false

# Actuator on its own port, which no Service exposes; the trace's observations make no meters.
management.server.port=9464
management.endpoints.web.exposure.include=health,prometheus
management.metrics.enable.aisolate.trace=false
management.endpoint.health.probes.enabled=true
