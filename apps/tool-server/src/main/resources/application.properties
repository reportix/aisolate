spring.application.name=tool-server
server.port=8081

# MCP server: stateless streamable HTTP on POST /mcp. Every call carries its own user token; there is
# no protocol session to correlate on.
spring.ai.mcp.server.name=aisolate-tool-server
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STATELESS

# Same issuer and audience as the backend: the tool server re-validates the user's token itself.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AISOLATE_ISSUER_URI:http://localhost:8180/realms/acme}
spring.security.oauth2.resourceserver.jwt.audiences=${AISOLATE_AUDIENCE:aisolate}
# Where the organisation's tokens carry the roles the rules name.
aisolate.roles-claim=${AISOLATE_ROLES_CLAIM:realm_access.roles}

# The documents the controller mounts, the same ConfigMap as the airlock pods; only their revision
# answers, anything else is a silent deny.
aisolate.config.dir=${AISOLATE_CONFIG_DIR:}
aisolate.config.revision=${AISOLATE_CONFIG_REVISION:}

# aisolate.datasource[i].*, from AISOLATE_DATASOURCE_<i>_*: the airlock's data sources, one pool each.
# Spring's single data source has nothing to bind.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# The airlock's jar, fetched at start from the backend (AISOLATE_CODE_URL, with the airlock's code token) and
# checked against AISOLATE_CODE_DIGEST; any refusal fails the start. Without a digest, a local run or a test
# loads the jars of AISOLATE_PLUGINS_DIR pinned by AISOLATE_PLUGIN_DIGESTS; nothing renders those in a cluster.
aisolate.code.url=${AISOLATE_CODE_URL:}
aisolate.code.digest=${AISOLATE_CODE_DIGEST:}
aisolate.code.token-file=${AISOLATE_CODE_TOKEN_FILE:}
aisolate.plugins.dir=${AISOLATE_PLUGINS_DIR:}
aisolate.plugins.digests=${AISOLATE_PLUGIN_DIGESTS:}

# Every call is a span of the airlock's trace.
management.tracing.sampling.probability=1.0
# Actuator on its own port, which no Service exposes; the trace's observations make no meters.
management.server.port=9464
management.endpoints.web.exposure.include=health,prometheus
management.metrics.enable.aisolate.trace=false
management.endpoint.health.probes.enabled=true
