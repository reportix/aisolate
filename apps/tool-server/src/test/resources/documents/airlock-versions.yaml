apiVersion: aisolate.dev/v1
kind: AirlockVersion
metadata: {name: hr-assistant-v1}
spec:
  airlock: hr-assistant
  version: v1
  description: Pay from the tools, policies from the HR documents.
  preLLM:
    contextPreparator:
      handlers: [HrDocumentsContextPreparator]
    conversationMemory:
      handlers: [SessionMemory]
  llm: qwen
  prompt: |
    You are the Acme HR assistant. All amounts are in EUR.
  tools: [read_records, aggregate_records]
  postLLM:
    answerVerifier:
      handlers: [SalaryVerifier]
  jar: {digest: "sha256:9f2c", tools: [read_records, aggregate_records]}
---
apiVersion: aisolate.dev/v1
kind: AirlockVersion
metadata: {name: founders-finance-v1}
spec:
  airlock: founders-finance
  version: v1
  llm: qwen
  prompt: |
    You answer the founders only.
  tools: [read_records, export_payslips]
  jar: {digest: "sha256:5e1a", tools: [read_records, export_payslips]}
---
apiVersion: aisolate.dev/v1
kind: AirlockVersion
metadata: {name: hr-archive-v1}
spec:
  airlock: hr-archive
  version: v1
  llm: qwen
  prompt: |
    You read the HR archive.
  tools: [read_archive]
  jar: {digest: "sha256:7b3d", tools: [read_archive]}
