spring.application.name=aisolate-backend
server.port=8080
# Requests block on the database and the cluster API: virtual threads throughout.
spring.threads.virtual.enabled=true

# Control-plane database (owned by the backend: Flyway runs here).
spring.datasource.url=${AISOLATE_DB_URL:jdbc:postgresql://localhost:5432/aisolate}
spring.datasource.username=${AISOLATE_DB_USERNAME:aisolate}
spring.datasource.password=${AISOLATE_DB_PASSWORD}
spring.flyway.enabled=true

# Customer identity provider. One trusted issuer; audience binding is mandatory.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AISOLATE_ISSUER_URI:http://localhost:8180/realms/acme}
spring.security.oauth2.resourceserver.jwt.audiences=aisolate
# Dot path of the roles claim in the customer's tokens (Keycloak: realm_access.roles).
aisolate.roles-claim=${AISOLATE_ROLES_CLAIM:realm_access.roles}

# The company's directory, read-only: Keycloak's admin API through a service account that holds
# realm-management's view-users and query-users only. The AIsolate UI's Add users searches it and an
# added user must be in it; admission still reads the lists alone. Empty URL: users are typed e-mails.
aisolate.directory.url=${AISOLATE_DIRECTORY_URL:}
aisolate.directory.realm=${AISOLATE_DIRECTORY_REALM:}
aisolate.directory.client-id=${AISOLATE_DIRECTORY_CLIENT_ID:}
aisolate.directory.client-secret=${AISOLATE_DIRECTORY_CLIENT_SECRET:}

# Browser origins: the customer's chat and the AIsolate UI. The public URL builds endpoint links.
aisolate.cors.allowed-origins=${AISOLATE_CORS_ALLOWED_ORIGINS:*}
aisolate.public-url=${AISOLATE_PUBLIC_URL:http://localhost:8080}

# The data-plane namespace the backend applies Space and Airlock resources and the data sources' Secrets
# to after every write (empty: no cluster, the laptop).
aisolate.cluster.namespace=${AISOLATE_CLUSTER_NAMESPACE:}
# The audit trail. The key every airlock's ingest token derives from, which the chart shares
# with the controller only (empty: no line is admitted); the port the airlock pods hand their lines over on,
# apart from the API's; whole months kept before the current one (84: seven years).
aisolate.audit.ingest-key=${AISOLATE_AUDIT_INGEST_KEY:}
aisolate.audit.ingest-port=${AISOLATE_AUDIT_INGEST_PORT:8085}
aisolate.audit.retention-months=${AISOLATE_AUDIT_RETENTION_MONTHS:84}
# The organisation the audit export's XBRL report is of: its LEI or <scheme>:<id>; empty: the install itself.
aisolate.audit.entity=${AISOLATE_AUDIT_ENTITY:${aisolate.public-url}:aisolate}
# The trace store's query API, Jaeger's or one that answers GET /api/traces/{id} alike, in-cluster: Monitoring's
# trace page reads it through the backend (empty: no Monitoring, its endpoints are 404).
aisolate.tracing.query-url=${AISOLATE_TRACING_QUERY_URL:}
# Prometheus's HTTP API in the cluster, for Monitoring's charts: fixed queries scoped by the series' space label
# (empty: no Metrics tab, /v1/metrics is 404).
aisolate.metrics.query-url=${AISOLATE_METRICS_QUERY_URL:}

# The AIsolate UI API's OpenAPI document and Swagger UI, served without a token: off unless asked for.
springdoc.api-docs.enabled=${AISOLATE_API_DOCS:false}
# Multipart form fields are documented as parts of the body, the way the AIsolate UI sends them.
springdoc.default-support-form-data=true

# Actuator (health for the kubelet, prometheus for the scraper) on its own port, which no Service exposes.
management.server.port=9464
# prometheus without a token (names and counts only); metrics behind the API's token check.
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# A deploy carries one airlock's jar (or Python zip) next to its aisolate.yaml, on disk from the first
# byte (threshold 0) and stored in chunks: no size limit unless the operator sets one (500MB, say).
# A refused upload is still read to its end, so the client gets the 400 rather than a reset connection.
spring.servlet.multipart.max-file-size=${AISOLATE_MAX_ARTIFACT_SIZE:-1}
spring.servlet.multipart.max-request-size=-1
spring.servlet.multipart.file-size-threshold=0
server.tomcat.max-swallow-size=-1
