spring.application.name=aisolate-controller
server.port=8082
# Installation-level settings, rendered by the chart into a ConfigMap; the documents come from the API.
spring.config.import=optional:file:/etc/aisolate/settings.yaml
aisolate.controller.namespace=${POD_NAMESPACE:aisolate}
# Actuator (health for the kubelet, prometheus for the scraper) on its own port, which no Service exposes.
management.server.port=9464
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
