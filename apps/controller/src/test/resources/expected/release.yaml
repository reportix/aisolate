---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  labels:
    aisolate.dev/airlock: "hr-assistant"
    aisolate.dev/managed-by: "controller"
    aisolate.dev/revision: "192feb393eee"
  name: "hr-acme-hr-assistant-config"
  namespace: "aisolate"
  ownerReferences:
  - apiVersion: "aisolate.dev/v1"
    kind: "Airlock"
    controller: true
    name: "hr-assistant"
    uid: "uid-hr"
data:
  Global-aisolate.yaml: |
    ---
    apiVersion: aisolate.dev/v1
    kind: Global
    metadata:
      name: aisolate
    spec:
      llms:
      - id: granite
        provider: ollama
        url: https://models.example.com
        model: granite4.1:8b
      - id: nomic
        provider: ollama
        url: http://host.minikube.internal:11434
        model: nomic-embed-text
      dataSources:
      - id: audit_log
        url: jdbc:postgresql://acme-db.aisolate.svc:5432/audit
        secretRef: aisolate-ds-audit-log-j1k2l3
  Space-hr-acme.yaml: |
    ---
    apiVersion: aisolate.dev/v1
    kind: Space
    metadata:
      name: hr-acme
    spec:
      displayName: HR Acme
      description: Acme people and compensation data for the HR assistant.
      access:
        roles:
        - ceo
        - hr
      llms:
      - id: qwen
        provider: ollama
        url: https://models.example.com
        model: qwen3.6:27b-q4_K_M
      dataSources:
      - id: acme_hr
        url: jdbc:postgresql://acme-db.aisolate.svc:5432/acme_hr
        secretRef: hr-acme-ds-acme-hr-a1b2c3
  Airlock-hr-assistant.yaml: |
    ---
    apiVersion: aisolate.dev/v1
    kind: Airlock
    metadata:
      name: hr-assistant
    spec:
      space: hr-acme
      displayName: Acme HR assistant
      description: "Answers people, pay and HR document questions."
      access:
        roles:
        - employee
        - hr
        callers:
        - '*'
      preLLM:
        contextPreparator:
          handlers:
          - HrDocumentsContextPreparator
        conversationMemory:
          handlers:
          - SessionMemory
      llm: granite
      prompt: |
        You are the Acme HR assistant. All amounts are in EUR.
      tools:
      - read_records
      - aggregate_records
      postLLM:
        answerVerifier:
          handlers:
          - SalaryVerifier
      llms:
      - id: nomic
        provider: ollama
        url: http://host.minikube.internal:11434
        model: nomic-embed-text:v1.5
      dataSources:
      - id: hr-documents
        url: jdbc:postgresql://acme-db.aisolate.svc:5432/acme_hr
        secretRef: hr-acme-hr-assistant-ds-hr-documents-d4e5f6
      jar:
        digest: sha256:784c6018d0c0bb8d5ca5bf7e112fddd4a7f6df85f8517b1669c75e7b159aa24f
        tools:
        - read_records
        - aggregate_records
