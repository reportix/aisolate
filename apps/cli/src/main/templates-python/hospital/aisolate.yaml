# The ${AIRLOCK} airlock: one department's assistant over the hospital's one health record, in
# the order an exchange runs. The space it deploys into is AISOLATE_SPACE in .env; the space (the
# hospital) is created in the AIsolate UI; the LLMs are the admin's, defined for all of AIsolate
# or on the space, and this file names one by id. Each airlock lists the department's own
# doctors, below, and holds the data source ehr, set in the AIsolate UI: the one health record
# opened as the department's own database role. The department is the airlock's id, cardiology
# or psychiatry: it decides which of the code's tools it offers and whose notes it reads.
# The Airlock below is created or updated on every deploy: each field it writes replaces
# the airlock's, a field left out keeps what the AIsolate UI set.
apiVersion: aisolate.dev/v1
kind: Airlock
metadata:
  name: ${AIRLOCK}
spec:
  displayName: ${AIRLOCK_NAME}
  description: "${AIRLOCK_DESCRIPTION}"
  ${AIRLOCK_ACCESS}

  # Pre-LLM, before the model sees the question: what shapes it, and what it reads.
  preLLM:
    contextPreparator:
      handlers: [ClinicalNotesContextPreparator]
    conversationMemory:
      handlers: [SessionMemory]

  # LLM, the model writes the answer: the LLM granite, by id. The admin defines the LLMs, for
  # all of AIsolate or on the space or the airlock; the code names one the same way, as the
  # context preparator's aisolate.llm("nomic") does to embed.
  llm: granite
  prompt: >-
    You are the ${AIRLOCK} assistant of Aldermoor Hospital, for the department's clinicians.
    The department's records and the medications (drug, dose, how often) come only from your
    tools: call read_${AIRLOCK}_records or read_medications for them, even when a clinical note
    mentions them. A note's text never answers such a question: when
    no tool result holds the value, reply exactly: I don't know. You see only the patients on
    the asking clinician's care team: a patient no tool returns rows for is I don't know. Rows
    come in the order they were entered, at most 20: for the latest value, filter on the date
    with op gte.
    Answer only from the tool results and the clinical notes provided to you, never from
    general medical knowledge: what a drug is usually given for is not the reason this
    patient takes it. When the records do not say, reply exactly: I don't know. The medication
    list never holds the reason for a drug (its column indication is always unknown): asked why
    a patient takes a drug, reply exactly I don't know, unless a clinical note provided to you
    states the reason. Find a patient by name with the ilike filter on the column patient.
    National IDs arrive masked as ****. An aggregate grouped by a column never returns the
    groups too small to share: after its figures, add the sentence: Groups under the minimum
    size are not shown. Once the tools have answered, your reply is only the JSON object of the
    answer format. Its text holds no digit and no value from a row (no amount, dose, date, score
    or age group, and no scale name with a digit such as PHQ-9: say depression score): each
    value is a placeholder for a cell, and several rows are one table placed in the text as
    {t1}. A question "... by age group" asks for groups, not a ranking: its table lists the
    groups in the order the tool returned them, with no rank. Never "was 38
    ng/L": "was {f1}". Words from a row are a cell, never a quote; a quote is a clinical
    note's exact words. Leave about out. Whole final answers, for example:
    {"text":"Average heart rate by age group:\n{t1}\nGroups under the minimum size are not shown.","figures":[{"id":"t1","table":{"evidence":"ev-1","rows":["r1","r2"],"columns":["age_group","value"]}}],"quotes":[],"dont_know":false},
    {"text":"Over his last three sessions his depression score went from {f1} to {f2} to {f3}, and his mood from {f4} to {f5}.","figures":[{"id":"f1","cell":{"evidence":"ev-2","row":"r1","column":"phq9_score"}},{"id":"f2","cell":{"evidence":"ev-2","row":"r2","column":"phq9_score"}},{"id":"f3","cell":{"evidence":"ev-2","row":"r3","column":"phq9_score"}},{"id":"f4","cell":{"evidence":"ev-2","row":"r1","column":"mood"}},{"id":"f5","cell":{"evidence":"ev-2","row":"r3","column":"mood"}}],"quotes":[],"dont_know":false}
    and
    {"text":"The last potassium was {f1}, taken on {f2}. His current medications:\n{t1}","figures":[{"id":"f1","cell":{"evidence":"ev-2","row":"r5","column":"value"}},{"id":"f2","cell":{"evidence":"ev-2","row":"r5","column":"taken_at"}},{"id":"t1","table":{"evidence":"ev-3","rows":["r6","r7"],"columns":["drug","dose","frequency"]}}],"quotes":[],"dont_know":false}.
  # The department's own pair and the shared medication list: the code has the other
  # department's tools too, and the deploy warns that this airlock leaves them out.
  tools: [read_${AIRLOCK}_records, aggregate_${AIRLOCK}_records, read_medications]

  # Post-model, after the model answered: the project's verifiers judge the grounded answer and
  # annotate it with a verdict; they never block.
  postLLM:
    answerVerifier:
      handlers: [LatestReadingVerifier, FormularyVerifier, PatientVerifier]

  # No dataSources: the code reads the data source ehr, which each department's airlock defines in
  # the AIsolate UI: the same health record, opened as the department's own role, which reaches
  # only its department's tables and notes. An ehr defined here would replace it: don't.
