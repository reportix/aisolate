[project]
name = "aisolate-tool-server"
version = "0.1.0"
description = "The Python tool server: an airlock's governed tools over MCP, the same gates, rules and SQL as the Java one."
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aisolate",
    "aisolate-runtime",
    "mcp==2.3.0",
]

[tool.uv.sources]
aisolate = { path = "../../libs/sdk-python" }
aisolate-runtime = { path = "../../libs/runtime-python" }

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisolate_tool_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
