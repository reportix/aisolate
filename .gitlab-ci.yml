# AIsolate CI. Public images only.
stages: [check, test, scan, package]

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"

default:
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths: [.gradle-home/caches, .gradle-home/wrapper, node_modules]

spotless:
  stage: check
  image: eclipse-temurin:25-jdk
  script: ./gradlew spotlessCheck --console=plain

# One npm workspace: the shared UI package, the AIsolate UI and the sample chat, installed once from the root.
web-check:
  stage: check
  image: node:24
  script:
    - npm ci
    - npm run lint
    - npm run format
    - npm test
    - npm run build
    - npm audit --audit-level=high

# Integration tests start Keycloak and PostgreSQL through Testcontainers (Docker socket needed).
gradle-test:
  stage: test
  image: eclipse-temurin:25-jdk
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # The runner sets DOCKER_TLS_VERIFY=1; dind here listens without TLS.
    DOCKER_TLS_VERIFY: "0"
    TESTCONTAINERS_HOST_OVERRIDE: docker
    # OOM-killed at the runner's 4Gi default: the 2g-heap Gradle JVM needs ~3 GiB and each
    # parallel test task forks another JVM, so 8Gi with two workers; dind hosts Postgres 18 and Keycloak 26.
    KUBERNETES_MEMORY_REQUEST: 6Gi
    KUBERNETES_MEMORY_LIMIT: 8Gi
    KUBERNETES_SERVICE_MEMORY_REQUEST: 2Gi
    KUBERNETES_SERVICE_MEMORY_LIMIT: 4Gi
  script: ./gradlew test --console=plain --max-workers=2
  artifacts:
    when: always
    reports:
      junit: "**/build/test-results/*/TEST-*.xml"

# The Python modules' and templates' tests (./gradlew pythonTest); uv brings Python 3.13.
python-test:
  stage: test
  image: eclipse-temurin:25-jdk
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [.uv-cache, .gradle-home/caches, .gradle-home/wrapper]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl
    - curl -LsSf https://astral.sh/uv/0.13.5/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script: ./gradlew pythonTest --console=plain

# Vulnerabilities in locked dependencies (gradle.lockfile, package-lock.json) and leaked secrets.
trivy:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .

# The Windows CLI's installer. A native image is built on the system it runs on, so aisolate.exe is built on a
# Windows machine; this job packages it with NSIS. Run it by hand with WINDOWS_EXE_URL (where the runner can
# download that exe) and WINDOWS_EXE_SHA256 set; never in an MR pipeline.
cli-windows-installer:
  stage: package
  needs: []
  inherit:
    default: false
  image: debian:bookworm-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: manual
      allow_failure: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl nsis
  script:
    - test -n "$WINDOWS_EXE_URL" && test -n "$WINDOWS_EXE_SHA256" || { echo "Set WINDOWS_EXE_URL and WINDOWS_EXE_SHA256."; exit 1; }
    - mkdir -p apps/cli/build/win-installer
    - cp apps/cli/installer/windows/aisolate-cli-installer.nsi apps/cli/installer/LICENSE apps/cli/build/win-installer/
    - curl -fsSL -o apps/cli/build/win-installer/aisolate.exe "$WINDOWS_EXE_URL"
    - echo "$WINDOWS_EXE_SHA256  apps/cli/build/win-installer/aisolate.exe" | sha256sum -c -
    - cd apps/cli/build/win-installer && makensis aisolate-cli-installer.nsi
  artifacts:
    paths: [apps/cli/build/win-installer/aisolate-cli-installer.exe]
    expire_in: 30 days
