# Reportix's release component scans main for vulnerabilities and publishes the runtime images: to docker-internal
# on every merge, to docker-public, which anyone can pull, on a tag X.Y.Z. Every merge request bumps `version` in
# gradle.properties. The UI and the chat bake their deployment's URLs at build time, so deployments build them.
include:
  - component: $CI_SERVER_FQDN/reportix/ci-templates/release@1
    inputs:
      image: docker-internal.sonatype.reportix.com/reportix/ci-images/java:latest
      release_channel: public
      internal_publish_command: './scripts/publish-images.sh "$RESOLVED_VERSION" "$PUBLISH_CHANNEL"'
      release_publish_command: './scripts/publish-images.sh "$CI_COMMIT_TAG" "$PUBLISH_CHANNEL"'
      image_names: >-
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/backend
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/airlock
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/tool-server
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/controller
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/airlock-python
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/tool-server-python
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/keycloak
      version_gate: increase

stages: [check, test, package, publish-internal, publish-release]

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"

default:
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths: [.gradle-home/caches, .gradle-home/wrapper, node_modules]

spotless:
  stage: check
  image: docker-internal.sonatype.reportix.com/reportix/ci-images/java:latest
  script: ./gradlew spotlessCheck --console=plain

# One npm workspace: the shared UI package, the AIsolate UI and the sample chat, installed once from the root.
web-check:
  stage: check
  image: docker-internal.sonatype.reportix.com/reportix/ci-images/node-24:latest
  script:
    - npm ci
    - npm run lint
    - npm run format
    - npm test
    - npm run build
    - npm audit --audit-level=high

# Integration tests start Keycloak and PostgreSQL through Testcontainers on the runner's own dind sidecar
# (DOCKER_HOST and its TLS come with the job; the runner sizes the sidecar per job class).
gradle-test:
  stage: test
  image: docker-internal.sonatype.reportix.com/reportix/ci-images/java:latest
  variables:
    TESTCONTAINERS_HOST_OVERRIDE: docker
    # OOM-killed at the runner's 4Gi default: the 2g-heap Gradle JVM needs ~3 GiB and each
    # parallel test task forks another JVM, so 8Gi with two workers.
    KUBERNETES_MEMORY_REQUEST: 6Gi
    KUBERNETES_MEMORY_LIMIT: 8Gi
  script: ./gradlew test --console=plain --max-workers=2
  artifacts:
    when: always
    reports:
      junit: "**/build/test-results/*/TEST-*.xml"

# The Python modules' and templates' tests (./gradlew pythonTest); the generic image ships the JDK, uv and
# every Python, with 3.14 active: activate 3.13, the modules' interpreter, or uv trips over the inactive shim.
python-test:
  stage: test
  image: docker-internal.sonatype.reportix.com/reportix/ci-images/generic:latest
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [.uv-cache, .gradle-home/caches, .gradle-home/wrapper]
  before_script:
    - mise use -g python@3.13
  script: ./gradlew pythonTest --console=plain

# The Windows CLI's installer. A native image is built on the system it runs on, so aisolate.exe is built on a
# Windows machine; this job packages it with NSIS. Run it by hand with WINDOWS_EXE_URL (where the runner can
# download that exe) and WINDOWS_EXE_SHA256 set.
cli-windows-installer:
  stage: package
  needs: []
  inherit:
    default: false
  image: debian:bookworm-slim
  rules:
    - when: manual
      allow_failure: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl nsis
  script:
    - test -n "$WINDOWS_EXE_URL" && test -n "$WINDOWS_EXE_SHA256" || { echo "Set WINDOWS_EXE_URL and WINDOWS_EXE_SHA256."; exit 1; }
    - mkdir -p apps/cli/build/win-installer
    - cp apps/cli/installer/windows/aisolate-cli-installer.nsi apps/cli/installer/LICENSE apps/cli/build/win-installer/
    - curl -fsSL -o apps/cli/build/win-installer/aisolate.exe "$WINDOWS_EXE_URL"
    - echo "$WINDOWS_EXE_SHA256  apps/cli/build/win-installer/aisolate.exe" | sha256sum -c -
    - cd apps/cli/build/win-installer && makensis aisolate-cli-installer.nsi
  artifacts:
    paths: [apps/cli/build/win-installer/aisolate-cli-installer.exe]
    expire_in: 30 days
