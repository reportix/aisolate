# Reportix's release component scans main for vulnerabilities and publishes the runtime images: to docker-internal
# on every merge, to docker-public, which anyone can pull, on a tag X.Y.Z. Every merge request bumps `version` in
# gradle.properties. After every merge, release-deploy pins the seven published images in the chart
# (aisolate/charts/aisolate, its bot branch next, auto-merged to main); a release is promoted there by hand. The UI and the chat bake their deployment's URLs at build time, so deployments build them.
# A tag's pipeline also builds the Windows CLI installer on the Windows runner (cli-windows-installer) and creates
# the tag's GitLab Release with it attached (gitlab-release); the macOS installer is a maintainer's (docs/release.md).
include:
  - component: $CI_SERVER_FQDN/reportix/ci-templates/release@1
    inputs:
      image: docker-internal.sonatype.reportix.com/reportix/ci-images/java:latest
      release_channel: public
      internal_publish_command: './scripts/publish-images.sh "$RESOLVED_VERSION" "$PUBLISH_CHANNEL"'
      release_publish_command: './scripts/publish-images.sh "$CI_COMMIT_TAG" "$PUBLISH_CHANNEL"'
      image_names: >-
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/backend
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/airlock
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/tool-server
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/controller
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/airlock-python
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/tool-server-python
        docker-${PUBLISH_CHANNEL}.sonatype.reportix.com/aisolate/keycloak
      version_gate: increase
      # Opt-in deploys: release-deploy (automatic, main, after publish-internal) pins every image
      # listed in image_names, so that list must name exactly the images the chart should pin.
      # Chart deploy/release flow: the image bump lands on the chart repo's ephemeral bot branch
      # `next`, and an auto-merged MR carries it to main once the chart pipeline is green (the CLI
      # bootstraps/deletes `next` and self-heals it against main). No direct pushes to chart main.
      deploy_chart: https://gitlab.reportix.com/aisolate/charts/aisolate.git

stages: [check, test, package, publish-internal, publish-release]

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"

default:
  cache:
    # One cache for the project. A key with the branch name in it stores a copy for every branch,
    # Renovate's included, and the runners' cache storage has a quota.
    key: gradle
    paths: [.gradle-home/caches, .gradle-home/wrapper, node_modules]

spotless:
  stage: check
  image: docker-internal.sonatype.reportix.com/reportix/ci-images/java:latest
  script: ./gradlew spotlessCheck --console=plain

# One npm workspace: the shared UI package, the AIsolate UI and the sample chat, installed once from the root.
web-check:
  stage: check
  image: docker-internal.sonatype.reportix.com/reportix/ci-images/node-24:latest
  script:
    - npm ci
    - npm run lint
    - npm run format
    - npm test
    - npm run build
    - npm audit --audit-level=high

# Integration tests start Keycloak and PostgreSQL through Testcontainers on the runner's own dind sidecar
# (DOCKER_HOST and its TLS come with the job; the runner sizes the sidecar per job class).
gradle-test:
  stage: test
  image: docker-internal.sonatype.reportix.com/reportix/ci-images/java:latest
  variables:
    TESTCONTAINERS_HOST_OVERRIDE: docker
    # OOM-killed at the runner's 4Gi default: the 2g-heap Gradle JVM needs ~3 GiB and each
    # parallel test task forks another JVM, so 8Gi with two workers.
    KUBERNETES_MEMORY_REQUEST: 6Gi
    KUBERNETES_MEMORY_LIMIT: 8Gi
  script: ./gradlew test --console=plain --max-workers=2
  artifacts:
    when: always
    reports:
      junit: "**/build/test-results/*/TEST-*.xml"

# The Python modules' and templates' tests (./gradlew pythonTest); the generic image ships the JDK, uv and
# every Python, with 3.14 active: activate 3.13, the modules' interpreter, or uv trips over the inactive shim.
python-test:
  stage: test
  image: docker-internal.sonatype.reportix.com/reportix/ci-images/generic:latest
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    # One cache for the project. A key with the branch name in it stores a copy for every branch,
    # Renovate's included, and the runners' cache storage has a quota.
    key: uv
    paths: [.uv-cache, .gradle-home/caches, .gradle-home/wrapper]
  before_script:
    - mise use -g python@3.13
  script: ./gradlew pythonTest --console=plain

# The Windows CLI's installer, built from source on the Windows runner: a native image is built on the system it
# runs on, so aisolate.exe needs a Windows machine, and the image ships what the build needs (Liberica NIK 25 as
# JAVA_HOME, which the GraalVM plugin picks up; the Visual Studio Build Tools; NSIS). The MSVC environment is
# loaded by hand, as skye's core-platform does: native-image does not set it up itself.
.cli-windows-installer:
  stage: package
  needs: []
  inherit:
    # Neither the Linux cache nor GRADLE_USER_HOME: the image's default Gradle home has the wrapper's
    # distribution, so the job downloads no Gradle.
    default: false
    variables: false
  image: docker-internal.sonatype.reportix.com/reportix/ci-images/windows:latest
  tags: [windows]
  interruptible: true
  retry:
    max: 2
    when: [runner_system_failure]
  before_script:
    - |
      $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
      $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
      if (-not $vsPath) { throw "VS C++ build tools not found via vswhere" }
      cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
        if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "env:$($matches[1])" -Value $matches[2] }
      }
    - makensis /VERSION
  script:
    # The same gate as the release component's verify-release: a tag is the version it builds.
    - |
      $declared = (Get-Content gradle.properties | Where-Object { $_ -match '^version=' }) -replace '^version=', ''
      if ($env:CI_COMMIT_TAG -and $env:CI_COMMIT_TAG -ne $declared) { throw "tag $env:CI_COMMIT_TAG is not version=$declared in gradle.properties" }
    - ./gradlew :apps:cli:createWindowsInstaller --console=plain; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    # sha256sum -c format, LF-terminated, so the file checks on macOS and Linux too.
    - |
      $hash = (Get-FileHash -Algorithm SHA256 apps/cli/build/aisolate-cli-installer.exe).Hash.ToLower()
      [IO.File]::WriteAllText("$PWD\apps\cli\build\SHA256SUMS", "$hash  aisolate-cli-installer.exe`n")
      Get-Content apps/cli/build/SHA256SUMS
  artifacts:
    paths:
      - apps/cli/build/aisolate-cli-installer.exe
      - apps/cli/build/SHA256SUMS

# On a tag: the release's assets, which gitlab-release links, so they never expire.
cli-windows-installer:
  extends: .cli-windows-installer
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  artifacts:
    expire_in: never

# On a branch, by hand: a build to try.
cli-windows-installer-manual:
  extends: .cli-windows-installer
  rules:
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  artifacts:
    expire_in: 30 days

# The tag's GitLab Release. The release component verifies the tag and publishes the images but creates no
# Release (release@1 has no release: step and no asset input), so this job does, after publish-release, with
# the Windows installer and its checksum as asset links. The links are the tag's job artifacts, kept forever
# (cli-windows-installer): no second upload and no package registry entry to keep in step with the artifact.
# The permanent URLs are the direct asset paths, $CI_PROJECT_URL/-/releases/X.Y.Z/downloads/<file>. The macOS
# installer is attached by hand, and the GitHub mirror's release is copied by hand (docs/release.md).
gitlab-release:
  stage: publish-release
  needs: [publish-release, cli-windows-installer]
  inherit:
    default: false
    variables: false
  # The image the release keyword needs: it carries glab.
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script:
    - echo "Release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: >-
      AIsolate $CI_COMMIT_TAG. Images: `docker-public.sonatype.reportix.com/aisolate/<app>:$CI_COMMIT_TAG`.
      The Windows CLI installer is attached; the macOS installer is attached by a maintainer (docs/release.md).
    assets:
      links:
        - name: aisolate-cli-installer.exe
          url: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/apps/cli/build/aisolate-cli-installer.exe?job=cli-windows-installer
          filepath: /aisolate-cli-installer.exe
          link_type: package
        - name: SHA256SUMS
          url: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/apps/cli/build/SHA256SUMS?job=cli-windows-installer
          filepath: /SHA256SUMS
          link_type: other
