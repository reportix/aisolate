# AIsolate reference login theme: a CSS-only child of Keycloak's built-in keycloak.v2 (PatternFly 5).
# Mount this directory at /opt/keycloak/themes/aisolate and set the realm's loginTheme to "aisolate".
parent=keycloak.v2
import=common/keycloak
# `styles` replaces the parent's list, so the parent's stylesheet is listed again first.
styles=css/styles.css css/aisolate.css
# AIsolate's palette is light-only; the parent otherwise follows the OS colour scheme.
darkMode=false
