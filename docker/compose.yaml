# Local development environment for the AIsolate demo.
# Keycloak stands in for the customer's identity provider; acme-db is the customer's database;
# aisolate-db is AIsolate's own control plane. All passwords here are development-only.
name: aisolate

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-acme.json:/opt/keycloak/data/import/realm-acme.json:ro
      # Login themes; Keycloak reads /opt/keycloak/themes at runtime.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # The image ships no curl; the management port (9000) answers /health/ready.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30

  acme-db:
    # PostgreSQL 18 with pgvector: the hr and clients schemas, their documents with the context preparators' vectors.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: acme
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/acme:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme"]
      interval: 5s
      timeout: 5s
      retries: 20

  aisolate-db:
    image: postgres:18
    environment:
      POSTGRES_DB: aisolate
      POSTGRES_USER: aisolate
      POSTGRES_PASSWORD: aisolate
    ports:
      - "5432:5432"
    # Spaces and airlocks defined in the AIsolate UI live here; `down` keeps them, `down -v` wipes them.
    # PostgreSQL 18 wants the mount at /var/lib/postgresql, with PGDATA in a subdirectory of it.
    volumes:
      - aisolate-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisolate -d aisolate"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  aisolate-db-data:
