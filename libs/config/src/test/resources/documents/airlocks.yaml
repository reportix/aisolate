apiVersion: aisolate.dev/v1
kind: Airlock
metadata: {name: hr-assistant}
spec:
  space: hr-acme
  displayName: Acme HR assistant
  description: Answers people, pay and HR document questions.
  access: {roles: [employee, hr], callers: ["*"]}
  dataSources:
    - id: hr-documents
      url: jdbc:postgresql://acme-db.aisolate.svc:5432/acme_hr
      secretRef: hr-acme-hr-assistant-ds-hr-documents-d4e5f6
---
apiVersion: aisolate.dev/v1
kind: Airlock
metadata: {name: founders-finance}
spec:
  space: hr-acme
  displayName: Founders finance
  access: {roles: [founder], callers: ["*"]}
  llms:
    - {id: granite, provider: ollama, url: http://ollama-founders.aisolate.svc:11434, model: "granite4.1:8b"}
